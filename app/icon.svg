<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Watch strap top -->
  <rect x="12" y="1" width="8" height="5" rx="2" fill="#0f172a"/>
  <!-- Watch strap bottom -->
  <rect x="12" y="26" width="8" height="5" rx="2" fill="#0f172a"/>
  <!-- Watch case -->
  <circle cx="16" cy="16" r="11" fill="#0f172a"/>
  <!-- Watch dial -->
  <circle cx="16" cy="16" r="8.5" fill="white"/>
  <!-- Hour hand -->
  <line x1="16" y1="10.5" x2="16" y2="16" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="20.5" y2="18.5" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Centre dot -->
  <circle cx="16" cy="16" r="1.5" fill="#0f172a"/>
</svg>
